<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng Kỷ niệm 70 năm thành lập Đại học Bách Khoa Hà Nội</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cấu hình Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hust-red': '#cc0000',
                        'hp-blue': '#0055a4',
                        'bg-light': '#f0f4f8',
                        'primary-blue': '#2563eb',
                        'text-main': '#1f2937',
                        'text-muted': '#6b7280'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Các kiểu CSS tùy chỉnh -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Nền xanh nhạt giống bản thiết kế */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Tùy chỉnh thanh cuộn cho bảng admin */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Viền gradient phía trên biểu mẫu đăng ký */
        .gradient-border-top {
            position: relative;
        }
        .gradient-border-top::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #f59e0b);
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Tạo API toàn cục để React có thể gọi các hàm Firebase
        window.FirebaseAPI = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, collection, addDoc, onSnapshot
        };
        // Phát tín hiệu khi Firebase đã tải xong
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>
</head>
<body>
    <div id="root" class="flex-grow flex flex-col relative"></div>

    <!-- Ứng dụng React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EventInfo = () => {
            return (
                <div className="w-full lg:w-1/2 pr-0 lg:pr-8 mb-8 lg:mb-0">
                    {/* Logos */}
                    <div className="flex items-center space-x-6 mb-8">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Logo_HUST.png" alt="HUST Logo" className="h-16 object-contain" onError={(e) => e.target.src='https://placehold.co/100x100/cc0000/white?text=HUST'} />
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Logo_H%C3%B2a_Ph%C3%A1t.svg" alt="Hoa Phat Logo" className="h-10 object-contain" onError={(e) => e.target.src='https://placehold.co/200x60/0055a4/white?text=HOA+PHAT'} />
                    </div>

                    {/* Tiêu đề chính */}
                    <h1 className="text-3xl md:text-4xl font-bold text-hust-red mb-2 uppercase leading-tight">
                        Chào mừng<br />
                        Kỷ niệm 70 năm thành lập<br />
                        Đại học Bách Khoa Hà Nội
                    </h1>
                    <p className="text-hp-blue font-bold text-lg md:text-xl mb-1">(15/10/1956 - 15/10/2026)</p>
                    <p className="text-gray-800 font-semibold text-md uppercase mb-6">Tự hào truyền thống - Vững bước tương lai</p>

                    {/* Đoạn giới thiệu */}
                    <div className="space-y-4 text-text-main text-sm leading-relaxed mb-8">
                        <p className="flex items-start">
                            <span className="mr-2 text-yellow-500 mt-0.5"><i className="fas fa-sparkles"></i></span>
                            <span>Đại học Bách khoa Hà Nội đang đến gần cột mốc 70 năm xây dựng và phát triển (1956 – 2026), hành trình bảy thập kỷ bồi đắp trí tuệ, bản lĩnh, khát vọng cống hiến và những dấu ấn của biết bao thế hệ thầy cô giáo, cán bộ, sinh viên và cựu sinh viên.</span>
                        </p>
                        <p className="flex items-start">
                            <span className="mr-2 text-pink-500 mt-0.5"><i className="fas fa-heart"></i></span>
                            <span>70 năm là một dấu mốc của thời gian, cũng là câu chuyện được viết bởi mỗi thế hệ người Bách khoa. Dù đang học tập, làm việc, nghiên cứu hay đã rời mái trường xưa, chúng ta vẫn luôn là một phần trong hành trình ấy.</span>
                        </p>
                        <p className="flex items-start">
                            <span className="mr-2 text-blue-500 mt-0.5"><i className="fas fa-flag"></i></span>
                            <span>Hội Cựu sinh viên đang công tác tại <span className="font-bold text-hp-blue">Thép Hòa Phát Dung Quất</span> trân trọng kính mời các anh/chị/em tham dự buổi tiệc Gala gặp mặt hướng đến kỷ niệm ngày hội lớn.</span>
                        </p>
                    </div>

                    {/* Khung thời gian & địa điểm */}
                    <div className="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-8">
                        <div className="flex items-start mb-4">
                            <div className="w-8 flex justify-center text-blue-500 mt-1">
                                <i className="far fa-clock"></i>
                            </div>
                            <div>
                                <h3 className="font-semibold text-text-main text-sm uppercase text-gray-500">Thời gian</h3>
                                <p className="text-hp-blue font-bold text-lg">18h00, ngày 15/10/2026</p>
                            </div>
                        </div>
                        <div className="flex items-start">
                            <div className="w-8 flex justify-center text-blue-500 mt-1">
                                <i className="fas fa-map-marker-alt"></i>
                            </div>
                            <div>
                                <h3 className="font-semibold text-text-main text-sm uppercase text-gray-500">Địa điểm</h3>
                                <p className="text-hp-blue font-bold">Hội trường Tầng 4, Khách sạn Harmonia,</p>
                                <p className="text-hp-blue font-bold">KKT Dung Quất, xã Vạn Tường, tỉnh Quảng Ngãi.</p>
                            </div>
                        </div>
                    </div>

                    {/* Chữ ký */}
                    <div className="text-right text-sm text-text-muted mt-8">
                        <p className="italic mb-1">Thay mặt Ban liên lạc Hội CSV BKHN đang làm việc tại HPĐQ</p>
                        <p className="font-bold text-hp-blue text-base">Mr. Nguyễn Quang Tùng</p>
                        <p className="italic">Trân trọng kính mời!</p>
                    </div>
                </div>
            );
        };

        const Schedule = () => {
            return (
                <div className="bg-white rounded-xl shadow-sm p-6 mb-6">
                    <h2 className="text-lg font-bold text-hp-blue mb-4 flex items-center">
                        <i className="fas fa-list-ul mr-2 text-gray-400"></i> Chương trình dự kiến
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-gray-50 border border-gray-100 rounded-lg p-4">
                            <p className="text-red-500 font-bold mb-1">18:00 - 18:30</p>
                            <p className="text-sm text-gray-700">Đón khách, giao lưu</p>
                        </div>
                        <div className="bg-gray-50 border border-gray-100 rounded-lg p-4">
                            <p className="text-blue-500 font-bold mb-1">18:30</p>
                            <p className="text-sm text-gray-700">Khai mạc chương trình</p>
                        </div>
                        <div className="bg-gray-50 border border-gray-100 rounded-lg p-4">
                            <p className="text-green-500 font-bold mb-1">19:00</p>
                            <p className="text-sm text-gray-700">Khai tiệc</p>
                        </div>
                        <div className="bg-gray-50 border border-gray-100 rounded-lg p-4">
                            <p className="text-purple-500 font-bold mb-1">19:15 - 22:00</p>
                            <p className="text-sm text-gray-700">Mini game, giao lưu văn nghệ</p>
                        </div>
                    </div>
                </div>
            );
        };

        const RegistrationForm = ({ onSubmit, isSubmitting, successMessage }) => {
            const [name, setName] = useState('');
            const [department, setDepartment] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                if (!name.trim()) {
                    setError('Vui lòng nhập họ và tên.');
                    return;
                }
                if (!department.trim()) {
                    setError('Vui lòng nhập đơn vị.');
                    return;
                }
                onSubmit({ name, department });
            };

            // Modal thông báo thành công
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            useEffect(() => {
                if (successMessage) {
                    setShowSuccessModal(true);
                    setName('');
                    setDepartment('');
                    const timer = setTimeout(() => setShowSuccessModal(false), 3000);
                    return () => clearTimeout(timer);
                }
            }, [successMessage]);

            return (
                <div className="bg-white rounded-xl shadow-lg p-6 md:p-8 gradient-border-top relative overflow-hidden">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-bold text-text-main mb-2">Thông tin đăng ký</h2>
                        <p className="text-sm text-text-muted">Vui lòng điền thông tin để BTC chuẩn bị chu đáo nhất.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                Họ và tên <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="far fa-user text-gray-400"></i>
                                </div>
                                <input
                                    type="text"
                                    className="pl-10 w-full rounded-lg border border-gray-300 px-3 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue focus:border-transparent transition-colors"
                                    placeholder="Nhập đầy đủ họ tên..."
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    disabled={isSubmitting}
                                />
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                Đơn vị <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="far fa-building text-gray-400"></i>
                                </div>
                                <input
                                    type="text"
                                    className="pl-10 w-full rounded-lg border border-gray-300 px-3 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-blue focus:border-transparent transition-colors"
                                    placeholder="Ví dụ: NM.HRC1, P.CNTT..."
                                    value={department}
                                    onChange={(e) => setDepartment(e.target.value)}
                                    disabled={isSubmitting}
                                />
                            </div>
                        </div>

                        {error && <div className="text-red-500 text-sm mt-1">{error}</div>}

                        <button
                            type="submit"
                            disabled={isSubmitting}
                            className={`w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-blue hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-blue transition-colors mt-6 ${isSubmitting ? 'opacity-70 cursor-not-allowed' : ''}`}
                        >
                            {isSubmitting ? (
                                <span><i className="fas fa-spinner fa-spin mr-2"></i> Đang xử lý...</span>
                            ) : (
                                <span>Xác nhận đăng ký <i className="fas fa-arrow-right ml-2"></i></span>
                            )}
                        </button>
                    </form>

                    {/* Overlay thông báo thành công */}
                    {showSuccessModal && (
                        <div className="absolute inset-0 z-10 flex items-center justify-center bg-white bg-opacity-95">
                            <div className="text-center p-6">
                                <div className="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                                    <i className="fas fa-check text-green-600 text-2xl"></i>
                                </div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">Đăng ký thành công!</h3>
                                <p className="text-gray-500">Cảm ơn bạn đã xác nhận tham dự.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminPanel = ({ onClose, fallbackData, db, appId, user }) => {
            const [registrations, setRegistrations] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            // Lấy dữ liệu từ Cloud Firestore thay vì chỉ dùng dữ liệu tạm
            useEffect(() => {
                if (!db || !user) {
                    setRegistrations(fallbackData);
                    return;
                }

                setLoading(true);
                const { collection, onSnapshot } = window.FirebaseAPI;
                const regsRef = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                
                // Lắng nghe dữ liệu realtime
                const unsubscribe = onSnapshot(regsRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sắp xếp người đăng ký mới nhất lên trên
                    data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    
                    setRegistrations(data);
                    setLoading(false);
                }, (err) => {
                    console.error("Lỗi đọc dữ liệu đám mây:", err);
                    setError("Không thể kết nối máy chủ. Đang hiển thị dữ liệu tạm.");
                    setLoading(false);
                    setRegistrations(fallbackData);
                });

                return () => unsubscribe();
            }, [db, appId, user, fallbackData]);

            const formatDate = (timestamp) => {
                if (!timestamp) return 'N/A';
                try {
                    const date = new Date(timestamp);
                    return date.toLocaleString('vi-VN');
                } catch (e) {
                    return 'Invalid Date';
                }
            };

            const handleExportCSV = () => {
                const csv = "Họ và tên,Đơn vị,Thời gian đăng ký\n" + 
                    registrations.map(r => `"${r.name}","${r.department}","${formatDate(r.timestamp)}"`).join("\n");
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: 'text/csv;charset=utf-8;'});
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "danh_sach_dang_ky_bk70.csv";
                link.click();
            };

            return (
                <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                    <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                        {/* Lớp phủ mờ */}
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" aria-hidden="true" onClick={onClose}></div>

                        <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                        <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl w-full">
                            
                            <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-xl leading-6 font-bold text-gray-900 flex items-center">
                                        <i className="fas fa-users-cog mr-2 text-primary-blue"></i> Danh sách Đăng ký (Admin)
                                    </h3>
                                    <button onClick={onClose} className="text-gray-400 hover:text-gray-600 focus:outline-none">
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                
                                {error && (
                                    <div className="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
                                        <div className="flex items-center">
                                            <i className="fas fa-exclamation-circle text-red-400 mr-3"></i>
                                            <p className="text-sm text-red-700">{error}</p>
                                        </div>
                                    </div>
                                )}

                                <div className="mt-2">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="font-semibold text-gray-700 bg-gray-100 px-3 py-1 rounded-full text-sm">
                                            Tổng số: {registrations.length} người
                                        </span>
                                        <button 
                                            onClick={handleExportCSV}
                                            className="text-sm bg-green-50 text-green-700 hover:bg-green-100 px-3 py-1.5 rounded flex items-center border border-green-200 transition-colors"
                                            disabled={registrations.length === 0}
                                        >
                                            <i className="fas fa-file-csv mr-2"></i> Xuất file CSV
                                        </button>
                                    </div>
                                    
                                    <div className="overflow-x-auto border border-gray-200 rounded-lg max-h-96 custom-scrollbar">
                                        <table className="min-w-full divide-y divide-gray-200">
                                            <thead className="bg-gray-50 sticky top-0 shadow-sm z-10">
                                                <tr>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">STT</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Họ và tên</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Đơn vị</th>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thời gian ĐK</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {loading ? (
                                                    <tr><td colSpan="4" className="px-6 py-10 text-center text-gray-500"><i className="fas fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu...</td></tr>
                                                ) : registrations.length === 0 ? (
                                                    <tr><td colSpan="4" className="px-6 py-10 text-center text-gray-500">Chưa có ai đăng ký.</td></tr>
                                                ) : (
                                                    registrations.map((reg, index) => (
                                                        <tr key={reg.id || index} className="hover:bg-gray-50 transition-colors">
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{index + 1}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{reg.name}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{reg.department}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{formatDate(reg.timestamp)}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-gray-50 px-4 py-3 sm:px-6 flex justify-end">
                                <button type="button" onClick={onClose} className="inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-blue sm:text-sm">
                                    Đóng
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [successMessage, setSuccessMessage] = useState(false);
            
            // State quản lý Admin
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminError, setAdminError] = useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

            // Trạng thái hệ thống lưu trữ
            const [localData, setLocalData] = useState([]);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [db, setDb] = useState(null);
            const [appId, setAppId] = useState('');
            const [user, setUser] = useState(null);

            // Khởi tạo kết nối Đám mây khi tải trang
            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FirebaseAPI) return;
                    const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.FirebaseAPI;
                    
                    try {
                        const configString = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                        if (configString === '{}') {
                            console.warn("Đang chạy offline. Dữ liệu sẽ chỉ lưu tạm.");
                            setFirebaseReady(true);
                            return;
                        }

                        const config = JSON.parse(configString);
                        const app = initializeApp(config);
                        const auth = getAuth(app);
                        const firestoreDb = getFirestore(app);
                        
                        // Xác thực ẩn danh để có quyền ghi dữ liệu an toàn
                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-event-app';
                        
                        setDb(firestoreDb);
                        setAppId(currentAppId);
                        setUser(auth.currentUser);
                        setFirebaseReady(true);
                    } catch (err) {
                        console.error("Lỗi khởi tạo lưu trữ đám mây:", err);
                        setFirebaseReady(true); // Vẫn cho phép trang hoạt động bằng local data
                    }
                };

                if (window.FirebaseAPI) {
                    initFirebase();
                } else {
                    window.addEventListener('firebase-loaded', initFirebase);
                    return () => window.removeEventListener('firebase-loaded', initFirebase);
                }
            }, []);

            // Xử lý gửi form lên Cloud
            const handleRegistration = async (formData) => {
                setIsSubmitting(true);
                try {
                    const newRecord = {
                        name: formData.name,
                        department: formData.department,
                        timestamp: new Date().toISOString()
                    };

                    // Cập nhật lên UI ngay lập tức
                    setLocalData(prev => [{ id: Math.random().toString(36).substr(2, 9), ...newRecord }, ...prev]);

                    // Đẩy dữ liệu vĩnh viễn lên cơ sở dữ liệu
                    if (db && user) {
                        const { collection, addDoc } = window.FirebaseAPI;
                        const regsRef = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                        await addDoc(regsRef, newRecord);
                    }
                    
                    setSuccessMessage(true);
                } catch (error) {
                    console.error("Lỗi khi lưu đăng ký: ", error);
                    // Dữ liệu vẫn được giữ trong mảng localData nếu lỗi rớt mạng
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Xử lý đăng nhập Admin
            const handleAdminLoginSubmit = (e) => {
                e.preventDefault();
                if (adminPassword === 'admin123') {
                    setIsAdminLoggedIn(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    setAdminError('');
                } else {
                    setAdminError('Mật khẩu không đúng!');
                }
            };

            // Màn hình chờ hệ thống khởi tạo
            if (!firebaseReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-bg-light">
                        <div className="text-primary-blue text-xl flex flex-col items-center">
                            <i className="fas fa-spinner fa-spin text-4xl mb-4"></i>
                            <p>Đang chuẩn bị hệ thống...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full relative">
                    
                    {/* Nút bánh răng cưa (Admin) ẩn ở góc */}
                    <div className="absolute top-4 right-4 z-10">
                        <button 
                            onClick={() => {
                                if(isAdminLoggedIn) setIsAdminLoggedIn(true);
                                else setShowAdminLogin(true);
                            }} 
                            className="text-gray-400 hover:text-gray-700 transition-colors opacity-40 hover:opacity-100 focus:outline-none"
                            title="Đăng nhập Quản trị viên"
                        >
                            <i className="fas fa-cog text-xl"></i>
                        </button>
                    </div>

                    {/* Bố cục chính */}
                    <div className="flex flex-col lg:flex-row items-stretch justify-between gap-8 lg:gap-12 mt-4">
                        <EventInfo />
                        
                        <div className="w-full lg:w-1/2 flex flex-col justify-center">
                            <Schedule />
                            <RegistrationForm 
                                onSubmit={handleRegistration} 
                                isSubmitting={isSubmitting} 
                                successMessage={successMessage}
                            />
                        </div>
                    </div>

                    {/* Modal đăng nhập Admin */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            {/* Nền mờ nhạt */}
                            <div className="absolute inset-0 bg-gray-900 bg-opacity-40" onClick={() => setShowAdminLogin(false)}></div>
                            
                            <div className="bg-white rounded-lg p-6 w-full max-w-sm shadow-2xl relative z-10">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-lg font-bold text-gray-800">
                                        <i className="fas fa-lock mr-2 text-gray-500"></i> Quản trị viên
                                    </h3>
                                    <button onClick={() => setShowAdminLogin(false)} className="text-gray-400 hover:text-gray-600 focus:outline-none">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAdminLoginSubmit}>
                                    <div className="mb-5">
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <i className="fas fa-key text-gray-400"></i>
                                            </div>
                                            <input 
                                                type="password" 
                                                placeholder="Nhập mật khẩu..." 
                                                className="pl-10 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"
                                                value={adminPassword}
                                                onChange={(e) => setAdminPassword(e.target.value)}
                                                autoFocus
                                            />
                                        </div>
                                        {adminError && <p className="text-red-500 text-sm mt-2"><i className="fas fa-exclamation-circle mr-1"></i> {adminError}</p>}
                                    </div>
                                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded-md hover:bg-gray-900 transition-colors font-medium">
                                        Xác nhận
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Panel dữ liệu Admin */}
                    {isAdminLoggedIn && (
                        <AdminPanel 
                            onClose={() => setIsAdminLoggedIn(false)} 
                            fallbackData={localData}
                            db={db}
                            appId={appId}
                            user={user}
                        />
                    )}

                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
